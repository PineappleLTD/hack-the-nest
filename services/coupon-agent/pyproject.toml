[project]
name = "agent-shop-coupons"
version = "0.1.0"
description = "Saved coupon discovery and lookup for Agent Shop"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain>=1.3.2,<2",
    "langchain-openai>=1.4,<2",
    "python-dotenv>=1,<2",
    "tzdata>=2025.2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coupon_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
